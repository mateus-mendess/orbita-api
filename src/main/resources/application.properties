spring.application.name=orbita-api

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true

# Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD:}

# JWT (RSA Base64 PEM)
security.jwt.private-key-base64=${JWT_PRIVATE_KEY_BASE64}
security.jwt.public-key-base64=${JWT_PUBLIC_KEY_BASE64}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:604800}

# SMTP Mail
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM}
